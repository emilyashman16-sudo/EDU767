  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #app {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .background-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.25);
      z-index: 9998;
      pointer-events: none;
    }

    .spinner-outer-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      pointer-events: none;
    }

    .spinner-inner-wrapper {
      width: 100px;
      height: 70px;
      background: #f5f5f5;
      border-radius: 5px;
      box-shadow: 0 0 20px rgba(0, 0, 0, 0.25);
    }

    .spinner {
      animation: rotate 2s linear infinite;
      position: absolute;
      top: 50%;
      left: 50%;
      margin: -25px 0 0 -25px;
      width: 50px;
      height: 50px;
    }

    .spinner .path {
      stroke: #1c74dd;
      stroke-linecap: round;
      animation: dash 1.5s ease-in-out infinite;
    }

    .spinner .track {
      stroke: #d5d5d5;
    }

    @keyframes rotate {
      100% { transform: rotate(360deg); }
    }

    @keyframes dash {
      0% { stroke-dasharray: 1, 150; stroke-dashoffset: 0; }
      50% { stroke-dasharray: 90, 150; stroke-dashoffset: -35; }
      100% { stroke-dasharray: 90, 150; stroke-dashoffset: -124; }
    }
  </style>
</head>

<body>
  <div id="app"></div>

  <div class="background-overlay" id="loadingOverlay"></div>
  <div class="spinner-outer-wrapper" id="loadingSpinner">
    <div class="spinner-inner-wrapper">
      <svg class="spinner" viewBox="0 0 50 50">
        <circle class="track" cx="25" cy="25" r="20"
          fill="none" stroke-width="3"></circle>
        <circle class="path" cx="25" cy="25" r="20"
          fill="none" stroke-width="3"></circle>
      </svg>
    </div>
  </div>

  <script>
    (function () {
      function fitCaptivate() {
        const project = document.getElementById("CPProject");
        if (!project) return;

        const wrapper = document.getElementById("CPProject-wrapper");
        const viewportWidth = document.documentElement.clientWidth;
        const viewportHeight = document.documentElement.clientHeight;

        // Use the project's existing unscaled dimensions.
        const width = project.offsetWidth;
        const height = project.offsetHeight;

        if (!width || !height || !viewportWidth || !viewportHeight) return;

        const scale = Math.min(
          viewportWidth / width,
          viewportHeight / height
        );

        project.style.position = "fixed";
        project.style.left = "50%";
        project.style.top = "50%";
        project.style.transformOrigin = "center center";
        project.style.transform =
          "translate(-50%, -50%) scale(" + scale + ")";

        if (wrapper) {
          wrapper.style.overflow = "visible";
        }
      }

      function startWhenReady() {
        let attempts = 0;

        const timer = setInterval(function () {
          const project = document.getElementById("CPProject");

          if (project) {
            fitCaptivate();
            clearInterval(timer);
          }

          attempts++;
          if (attempts > 40) clearInterval(timer);
        }, 250);
      }

      window.addEventListener("load", startWhenReady);
      window.addEventListener("resize", fitCaptivate);
      startWhenReady();
    })();
  </script>
